aid: barkbox
name: BARK (BarkBox)
description: >-
  BARK, Inc. (operating as BarkBox) is a New York-based dog-focused consumer
  company founded in 2011 by Henrik Werdelin and Matt Meeker, serving over two
  million dogs monthly through its BarkBox and Super Chewer subscription boxes,
  the BARK Bright dental line, the BARK Air pet travel experience, and retail
  distribution. The company went public via a SPAC merger in 2021 (NYSE: BARK).
  BarkBox does not operate a public developer program or externally documented
  API portal; its engineering surface is a set of mostly-internal Ruby services
  and open-source libraries published under the github.com/barkbox organization
  (including the barkbox_client Ruby API client and cursor-pagination gems).
  This profile was surfaced as a Slow Ventures portfolio company and enriched
  with verified public identity and domain-security signals.
